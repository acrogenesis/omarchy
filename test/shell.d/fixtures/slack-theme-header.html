<!doctype html>
<meta charset="utf-8">
<style>
  /* Minimal Slack chrome: transparent headers over a separate accent layer,
     with a translucent sidebar. These surfaces exposed the Latte regression. */
  .p-client_workspace_wrapper { position: relative; color: var(--dt_color-content-inv-pry); }
  .p-theme_background { position: absolute; inset: 0; background: rgb(var(--dt_color-plt-primary-80)); }
  .chrome { position: relative; }
  .p-ia4_top_nav { padding: 12px; }
  .p-view_contents--sidebar { background: var(--dt_color-surf-inv-sec); padding: 12px; }
</style>
<style id="theme"></style>
<div class="p-client_workspace_wrapper">
  <div class="p-theme_background"></div>
  <div class="chrome">
    <div class="p-ia4_top_nav"><span id="header">Search workspace</span></div>
    <div class="p-view_contents--sidebar">
      <span id="company" class="p-ia4_home_header_menu__team_name">Company name</span>
    </div>
  </div>
</div>
<pre id="result">pending</pre>
<script>
  const palettes = PALETTES_JSON;
  const color = value => value.match(/[\d.]+/g).map(Number);
  const composite = (under, over) => under.slice(0, 3).map((c, i) => c * (1 - (over[3] ?? 1)) + over[i] * (over[3] ?? 1));
  const luminance = rgb => rgb.slice(0, 3).map(c => c / 255).map(c => c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4)
    .reduce((sum, c, i) => sum + c * [.2126, .7152, .0722][i], 0);
  const failures = [];
  for (const palette of palettes) {
    document.getElementById('theme').textContent = palette.css;
    for (const mode of ['dark', 'light', 'light-inverted-sidebar']) {
      document.body.className = 'sk-client-theme--' + mode;
      for (const id of ['header', 'company']) {
        const text = document.getElementById(id);
        let background = color(getComputedStyle(document.querySelector('.p-theme_background')).backgroundColor);
        const ancestors = [];
        for (let node = text; !node.classList.contains('p-client_workspace_wrapper'); node = node.parentElement) ancestors.unshift(node);
        for (const node of ancestors) background = composite(background, color(getComputedStyle(node).backgroundColor));
        const levels = [luminance(color(getComputedStyle(text).color)), luminance(background)].sort((a, b) => b - a);
        const ratio = (levels[0] + .05) / (levels[1] + .05);
        if (!(ratio >= 4.5)) failures.push({theme: palette.name, mode, id, ratio});
      }
    }
  }
  document.getElementById('result').textContent = JSON.stringify(failures);
</script>

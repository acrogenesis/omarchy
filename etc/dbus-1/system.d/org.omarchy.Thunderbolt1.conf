<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.omarchy.Thunderbolt1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.omarchy.Thunderbolt1" send_interface="org.omarchy.Thunderbolt1"/>
    <allow send_destination="org.omarchy.Thunderbolt1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.omarchy.Thunderbolt1" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
